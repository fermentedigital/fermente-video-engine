name: Fermente Runtime Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  runtime-smoke:
    name: API, WebUI and render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Prepare local config
        run: cp config.example.toml config.toml

      - name: Start API
        run: |
          nohup uv run --no-sync python main.py > /tmp/fermente-api.log 2>&1 &
          echo $! > /tmp/fermente-api.pid

      - name: Verify API health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ping | grep -q pong; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fermente-api.log || true
          exit 1

      - name: Start WebUI
        run: |
          nohup uv run --no-sync streamlit run ./webui/Main.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --browser.gatherUsageStats=false \
            > /tmp/fermente-webui.log 2>&1 &
          echo $! > /tmp/fermente-webui.pid

      - name: Verify WebUI health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -qi ok; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fermente-webui.log || true
          exit 1

      - name: Create deterministic local media
        run: |
          ffmpeg -y -f lavfi -i color=c=0x222222:s=1280x720:d=3:r=24 \
            -c:v libx264 -pix_fmt yuv420p /tmp/fermente-smoke.mp4
          ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 3 \
            -c:a pcm_s16le /tmp/fermente-smoke.wav

      - name: Render local end-to-end sample
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync python cli.py \
            --video-script "FERMENTE runtime smoke test." \
            --video-source local \
            --video-materials /tmp/fermente-smoke.mp4 \
            --custom-audio-file /tmp/fermente-smoke.wav \
            --no-subtitle-enabled \
            --bgm-type none \
            --video-aspect 16:9 \
            --video-concat-mode sequential \
            --stop-at video \
            | tee /tmp/fermente-render.json
          grep -q '"videos"' /tmp/fermente-render.json
          OUTPUT_VIDEO="$(find storage/tasks -type f -name '*.mp4' -size +1k | head -n 1)"
          test -n "$OUTPUT_VIDEO"
          cp "$OUTPUT_VIDEO" /tmp/fermente-runtime-smoke-output.mp4

      - name: Upload rendered sample
        uses: actions/upload-artifact@v4
        with:
          name: fermente-runtime-smoke-video
          path: /tmp/fermente-runtime-smoke-output.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Show logs on failure
        if: failure()
        run: |
          echo '--- API log ---'
          cat /tmp/fermente-api.log || true
          echo '--- WebUI log ---'
          cat /tmp/fermente-webui.log || true
          echo '--- Render result ---'
          cat /tmp/fermente-render.json || true
          echo '--- Task files ---'
          find storage/tasks -maxdepth 3 -type f -print 2>/dev/null || true
