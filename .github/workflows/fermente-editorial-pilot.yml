name: Fermente Editorial Pilot
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch containing the pilot project
        required: true
        default: feat/editorial-pilot-01
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg && uv sync --frozen --python 3.11 && cp config.example.toml config.toml
      - name: Create deterministic 1080p local fixtures
        run: |
          mkdir -p /tmp/pilot
          colors=(102030 1b3550 24465f 315b73 3c6f82 467f8a 2c5a64 24636c 39777e 4a8588 5a7880 716f66 7c6958 506f7a 344f66)
          for i in $(seq -w 1 15); do color="${colors[$((10#$i-1))]}"; ffmpeg -y -f lavfi -i color=c=0x${color}:s=1920x1080:d=6:r=24 -c:v libx264 -pix_fmt yuv420p /tmp/pilot/$i.mp4; done
          cp examples/fermente/ai-data-centers-water/project.json /tmp/pilot/project.json
          cp examples/fermente/ai-data-centers-water/editorial-review.json /tmp/pilot/editorial-review.json
      - name: Edge TTS baseline
        continue-on-error: true
        run: uv run --no-sync python scripts/fermente_edge_tts_smoke.py --voice en-US-AndrewNeural
      - name: Render pilot
        run: uv run --no-sync python scripts/fermente_render_project.py /tmp/pilot/project.json --output-json /tmp/pilot/quality-gate.json
      - name: Collect artifact
        if: always()
        run: |
          mkdir -p /tmp/artifact
          find storage/tasks -name '*.mp4' -exec cp {} /tmp/artifact/ai-data-centers-water-pilot.mp4 \; || true
          find storage/tasks -name 'subtitle.srt' -exec cp {} /tmp/artifact/subtitle.srt \; || true
          cp /tmp/pilot/project.json /tmp/artifact/project.json || true
          cp /tmp/pilot/quality-gate.json /tmp/artifact/quality-gate.json || true
          cp /tmp/pilot/editorial-review.json /tmp/artifact/editorial-review.json || true
      - uses: actions/upload-artifact@v4
        with: {name: fermente-editorial-pilot-01, path: /tmp/artifact, if-no-files-found: warn}
